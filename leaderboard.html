<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bảng Xếp Hạng — Đấu Trường Kiến Thức</title>
    <meta name="description" content="Bảng xếp hạng Top 20 nhân viên điểm cao nhất" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" />
    <style>
      body { background: #F9F5F0; }
      .lb-header { background: linear-gradient(145deg, #2C2C2C 0%, #1a1a1a 100%); }
      .lb-card { background: #fff; border: 1px solid #eee; border-radius: 20px; overflow: hidden; }
      .lb-strip { background: linear-gradient(90deg, #E07242, #E5853F, #677B40, #E9C691); }
      .self-badge {
        background: linear-gradient(135deg, #E07242, #E5853F);
        border: 1px solid rgba(224,114,66,0.2);
      }

      .rank-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid #f0ece5;
        transition: background 0.15s;
      }
      .rank-row:last-child { border-bottom: none; }
      .rank-row:hover { background: #fef8f2; }
      .rank-row.is-self { background: #FEF0E8; border-left: 4px solid #E07242; }

      .medal-gold {
        background: linear-gradient(135deg, #FFD700, #FFA000);
        border: 2px solid #F9A825;
        box-shadow: 0 2px 12px rgba(255,215,0,0.3);
      }
      .medal-silver {
        background: linear-gradient(135deg, #CFD8DC, #90A4AE);
        border: 2px solid #B0BEC5;
      }
      .medal-bronze {
        background: linear-gradient(135deg, #CD7F32, #A0522D);
        border: 2px solid #CD7F32;
      }
      .medal-default {
        background: #f5f0eb;
        border: 1px solid #e8e0d6;
        color: #877A6E;
      }

      .btn-brand {
        background: linear-gradient(135deg, #E07242, #E5853F);
        color: #fff;
        border: none;
        font-weight: 800;
        border-radius: 14px;
        padding: 12px 24px;
        cursor: pointer;
        transition: opacity 0.15s, transform 0.1s;
        box-shadow: 0 4px 16px rgba(224,114,66,0.25);
      }
      .btn-brand:hover { opacity: 0.92; }
      .btn-brand:active { transform: scale(0.97); }

      .btn-outline {
        background: #fff;
        color: #2C2C2C;
        border: 1.5px solid #ddd;
        font-weight: 800;
        border-radius: 14px;
        padding: 12px 24px;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
      }
      .btn-outline:hover { background: #f5f0eb; }
      .btn-outline:active { transform: scale(0.97); }

      @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(15px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-in { animation: fadeSlideUp 0.4s ease forwards; }
    </style>
  </head>
  <body class="min-h-screen flex flex-col">

    <!-- Brand Strip -->
    <div class="h-1.5 w-full lb-strip"></div>

    <!-- Header -->
    <header class="lb-header py-3.5 px-4 shadow-lg">
      <div class="max-w-md mx-auto flex items-center justify-between">
        <a href="/index.html" class="text-[#E9C691] hover:text-[#E07242] font-extrabold text-xs flex items-center gap-1 transition">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
          Portal
        </a>
        <h1 class="font-['Space_Grotesk'] font-black text-white text-sm uppercase tracking-wide">BẢNG VÀNG DANH VỌNG</h1>
        <div class="w-8"></div>
      </div>
    </header>

    <main class="w-full max-w-md mx-auto px-4 py-6 flex-1 flex flex-col">

      <!-- Title -->
      <div class="text-center mb-5 animate-in">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-3 overflow-hidden" style="background:linear-gradient(135deg,#E07242,#677B40);box-shadow:0 6px 24px rgba(224,114,66,0.3)">
          <img src="/logo/logo.png" alt="Quiz Logo" class="w-full h-full object-cover" />
        </div>
        <h2 class="text-xl font-black font-['Space_Grotesk'] text-[#2C2C2C] leading-tight uppercase">TOP 20 ĐẤU SĨ ĐIỂM CAO</h2>
        <p class="text-[#877A6E] text-[11px] mt-1">Xếp hạng dựa trên Tổng Điểm Tích Lũy</p>
      </div>

      <!-- Self rank widget -->
      <div id="self_rank_row" class="hidden mb-4 self-badge text-white p-4 rounded-2xl shadow-lg flex items-center justify-between animate-in">
        <div class="flex items-center gap-3">
          <span class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center font-black font-['Space_Grotesk'] text-sm" id="self_rank_num">#--</span>
          <div>
            <p class="font-bold text-sm text-white" id="self_name">Bạn</p>
            <p class="text-[10px] text-white/70 mt-0.5" id="self_dept">Phòng Ban</p>
          </div>
        </div>
        <span class="text-lg font-black text-white font-['Space_Grotesk']" id="self_score">0đ</span>
      </div>

      <!-- Leaderboard list -->
      <div class="lb-card flex-1 shadow-md animate-in" id="leaderboard_card">
        <div id="leaderboard_list">
          <!-- Loading spinner -->
          <div class="py-12 flex flex-col items-center justify-center text-[#877A6E] gap-3">
            <svg class="animate-spin h-7 w-7 text-[#E07242]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-xs font-semibold">Đang tổng hợp dữ liệu...</span>
          </div>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="mt-5 flex gap-3">
        <a href="/index.html" class="btn-outline flex-1 text-center text-xs uppercase tracking-wide">VỀ HOME PORTAL</a>
        <a href="/index.html" class="btn-brand flex-1 text-center text-xs uppercase tracking-wide">THỬ SỨC NGAY</a>
      </div>
    </main>

    <div class="h-3"></div>

    <footer class="text-center py-4 text-[#877A6E] text-xs border-t border-[#E9C691]/20">
      Bảng danh dự vinh danh đóng góp tri thức doanh nghiệp
    </footer>

    <script type="module" src="/leaderboard.js"></script>
  </body>
</html>
