<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập — Game HRIS</title>
    <meta name="description" content="Đăng nhập vào hệ thống Quiz nội bộ doanh nghiệp" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" />
    <style>
      body { background-color: #F9F5F0; }

      .brand-card {
        background: linear-gradient(145deg, #2C2C2C 0%, #1a1a1a 100%);
        border: 1px solid rgba(224, 114, 66, 0.15);
      }

      .brand-input {
        background: rgba(255,255,255,0.06);
        border: 1.5px solid rgba(224,114,66,0.2);
        color: #fff;
        border-radius: 14px;
        padding: 12px 14px 12px 44px;
        width: 100%;
        font-size: 0.875rem;
        font-weight: 600;
        transition: border-color 0.15s, background 0.15s;
        outline: none;
      }
      .brand-input::placeholder { color: rgba(255,255,255,0.25); }
      .brand-input:focus {
        border-color: #E07242;
        background: rgba(224,114,66,0.08);
        box-shadow: 0 0 0 3px rgba(224,114,66,0.15);
      }

      .btn-login {
        background: linear-gradient(135deg, #E07242 0%, #E5853F 100%);
        color: #fff;
        font-weight: 900;
        letter-spacing: 0.04em;
        border-radius: 14px;
        padding: 14px 24px;
        width: 100%;
        border: none;
        cursor: pointer;
        transition: opacity 0.15s, transform 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 0.95rem;
        box-shadow: 0 4px 20px rgba(224,114,66,0.35);
      }
      .btn-login:hover { opacity: 0.92; }
      .btn-login:active { transform: scale(0.98); }

      .logo-ring {
        background: linear-gradient(135deg, #E07242, #677B40);
        box-shadow: 0 8px 32px rgba(224,114,66,0.3);
      }

      .top-strip {
        background: linear-gradient(90deg, #E07242, #E5853F, #677B40, #E9C691);
      }

      .demo-btn {
        background: rgba(224,114,66,0.1);
        border: 1px solid rgba(224,114,66,0.2);
        border-radius: 12px;
        padding: 8px 12px;
        text-align: left;
        width: 100%;
        cursor: pointer;
        transition: background 0.15s;
        color: inherit;
      }
      .demo-btn:hover { background: rgba(224,114,66,0.2); }

      @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-in { animation: fadeSlideUp 0.45s ease forwards; }
    </style>
  </head>
  <body class="min-h-screen flex flex-col justify-between">

    <!-- Brand Decorative strip -->
    <div class="h-1.5 w-full top-strip"></div>

    <main class="w-full max-w-sm mx-auto px-4 py-10 flex-1 flex flex-col justify-center">

      <!-- Logo & Title -->
      <div class="text-center mb-7 animate-in">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl logo-ring text-white shadow-lg mb-4 overflow-hidden">
          <img src="./logo/logo.png" alt="Quiz Logo" class="w-full h-full object-cover" />
        </div>
        <h1 class="font-['Space_Grotesk'] text-2xl font-black text-[#2C2C2C] tracking-tight uppercase">XÁC THỰC NHÂN VIÊN</h1>
        <p class="text-xs text-[#877A6E] mt-1">Hệ thống Quiz nội bộ doanh nghiệp</p>
      </div>

      <!-- Sunday Alert Panel -->
      <div id="sunday_lock_banner" class="hidden mb-5 bg-orange-50 border border-orange-200 rounded-2xl p-4 text-center animate-in">
        <p class="text-xs font-bold text-orange-600 flex items-center justify-center gap-1.5">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
          Chủ Nhật bảo trì hệ thống
        </p>
        <p class="text-[11px] text-orange-500 mt-1">Game tạm đóng vào Chủ Nhật. Hẹn thứ Hai!</p>
      </div>

      <!-- Login Card -->
      <div class="brand-card rounded-3xl shadow-2xl p-7 animate-in">
        <form id="login_form" class="space-y-4">

          <!-- Tài khoản -->
          <div>
            <label for="employee_code" class="block text-[11px] font-bold uppercase tracking-widest text-orange-400 mb-2">Số điện thoại (SĐT)</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-orange-400/70">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.387a12.035 12.035 0 01-7.108-7.108c-.155-.44.011-.927.387-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" />
                </svg>
              </span>
              <input
                type="text"
                id="employee_code"
                required
                placeholder="SĐT hoặc Email đăng nhập"
                autofocus
                class="brand-input"
              />
            </div>
          </div>

          <!-- PIN -->
          <div>
            <label for="pin" class="block text-[11px] font-bold uppercase tracking-widest text-orange-400 mb-2">Mã PIN hoặc Mật khẩu</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-orange-400/70">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A3.75 3.75 0 1011.25 9H15.75zM15.75 9H4.5A2.25 2.25 0 002.25 11.25v8.25A2.25 2.25 0 004.5 21.75h15a2.25 2.25 0 002.25-2.25v-8.25A2.25 2.25 0 0019.5 9h-3.75z" />
                </svg>
              </span>
              <input
                type="password"
                id="pin"
                required
                placeholder="Mã PIN hoặc Mật khẩu"
                class="brand-input"
              />
            </div>
          </div>

          <!-- Error Alert -->
          <div id="error_alert" class="hidden p-3 bg-rose-500/10 border border-rose-500/20 text-rose-300 rounded-xl text-xs font-semibold leading-relaxed">
            Tài khoản không tồn tại hoặc mật khẩu không đúng.
          </div>

          <!-- Submit -->
          <button type="submit" id="btn_submit" class="btn-login mt-2">
            <span>ĐĂNG NHẬP</span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
            </svg>
          </button>
        </form>

      </div>
    </main>

    <footer class="text-center py-4 text-[#877A6E] text-xs border-t border-[#E9C691]/20">
      Truy cập tối ưu hóa cho màn hình Smartphone
    </footer>

    <script>
      // Removed fillCreds function
    </script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script type="module" src="/auth.js"></script>
  </body>
</html>
