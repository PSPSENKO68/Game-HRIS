<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập — Đấu Trường Kiến Thức</title>
  <meta name="description" content="Đăng nhập vào hệ thống Đấu Trường Kiến Thức" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" />
  <style>
    body {
      background-color: #F9F5F0;
    }

    .brand-card {
      background: linear-gradient(145deg, #2C2C2C 0%, #1a1a1a 100%);
      border: 1px solid rgba(224, 114, 66, 0.15);
    }

    .brand-input {
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(224, 114, 66, 0.2);
      color: #fff;
      border-radius: 14px;
      padding: 12px 14px 12px 44px;
      width: 100%;
      font-size: 0.875rem;
      font-weight: 600;
      transition: border-color 0.15s, background 0.15s;
      outline: none;
    }

    .brand-input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    .brand-input:focus {
      border-color: #E07242;
      background: rgba(224, 114, 66, 0.08);
      box-shadow: 0 0 0 3px rgba(224, 114, 66, 0.15);
    }

    .btn-login {
      background: linear-gradient(135deg, #E07242 0%, #E5853F 100%);
      color: #fff;
      font-weight: 900;
      letter-spacing: 0.04em;
      border-radius: 14px;
      padding: 14px 24px;
      width: 100%;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.95rem;
      box-shadow: 0 4px 20px rgba(224, 114, 66, 0.35);
    }

    .btn-login:hover {
      opacity: 0.92;
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .logo-ring {
      background: linear-gradient(135deg, #E07242, #677B40);
      box-shadow: 0 8px 32px rgba(224, 114, 66, 0.3);
    }

    .top-strip {
      background: linear-gradient(90deg, #E07242, #E5853F, #677B40, #E9C691);
    }

    .demo-btn {
      background: rgba(224, 114, 66, 0.1);
      border: 1px solid rgba(224, 114, 66, 0.2);
      border-radius: 12px;
      padding: 8px 12px;
      text-align: left;
      width: 100%;
      cursor: pointer;
      transition: background 0.15s;
      color: inherit;
    }

    .demo-btn:hover {
      background: rgba(224, 114, 66, 0.2);
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-in {
      animation: fadeSlideUp 0.45s ease forwards;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col justify-between">

  <!-- Brand Decorative strip -->
  <div class="h-1.5 w-full top-strip"></div>

  <main class="w-full max-w-sm mx-auto px-4 py-10 flex-1 flex flex-col justify-center">

    <!-- Logo & Title -->
    <div class="text-center mb-7 animate-in">
      <div
        class="inline-flex items-center justify-center w-16 h-16 rounded-2xl logo-ring text-white shadow-lg mb-4 overflow-hidden">
        <img src="/logo/logo.png" alt="Quiz Logo" class="w-full h-full object-cover" />
      </div>
      <h1 class="font-['Space_Grotesk'] text-2xl font-black text-[#2C2C2C] tracking-tight uppercase">ĐẤU TRƯỜNG KIẾN
        THỨC</h1>
      <p class="text-[11px] font-bold text-[#877A6E] mt-1 uppercase">CHƠI HAY NHẬN QUÀ NGAY !</p>
    </div>

    <!-- Login Card -->
    <div id="login_card_container" class="brand-card rounded-3xl shadow-2xl p-7 animate-in">
      <form id="login_form" class="space-y-4">

        <!-- Tài khoản -->
        <div>
          <label for="employee_code"
            class="block text-[11px] font-bold uppercase tracking-widest text-orange-400 mb-2">Họ và tên</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-orange-400/70">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
              </svg>
            </span>
            <input type="text" id="employee_code" required placeholder="Nhập họ và tên" autofocus
              class="brand-input" />
          </div>
        </div>

        <!-- PIN -->
        <div>
          <label for="pin" class="block text-[11px] font-bold uppercase tracking-widest text-orange-400 mb-2">Mã PIN
            hoặc Mật khẩu</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-orange-400/70">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M15.75 9V5.25A3.75 3.75 0 1011.25 9H15.75zM15.75 9H4.5A2.25 2.25 0 002.25 11.25v8.25A2.25 2.25 0 004.5 21.75h15a2.25 2.25 0 002.25-2.25v-8.25A2.25 2.25 0 0019.5 9h-3.75z" />
              </svg>
            </span>
            <input type="password" id="pin" required placeholder="Mã PIN hoặc Mật khẩu" class="brand-input" />
          </div>
        </div>

        <!-- Error Alert -->
        <div id="error_alert"
          class="hidden p-3 bg-rose-500/10 border border-rose-500/20 text-rose-300 rounded-xl text-xs font-semibold leading-relaxed">
          Tài khoản không tồn tại hoặc mật khẩu không đúng.
        </div>

        <!-- Submit -->
        <button type="submit" id="btn_submit" class="btn-login mt-2">
          <span>ĐĂNG NHẬP</span>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
            stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
          </svg>
        </button>
      </form>

    </div>

    <!-- First Login Force Password Change Card -->
    <div id="force_pwd_card" class="hidden brand-card rounded-3xl shadow-2xl p-7 animate-in">
      <div class="mb-5 text-center">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-orange-500/15 border border-orange-500/30 text-orange-400 mb-3">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
          </svg>
        </div>
        <h2 class="font-['Space_Grotesk'] text-lg font-black text-white uppercase tracking-tight">Đổi Mật Khẩu Lần Đầu</h2>
        <p class="text-xs text-white/60 mt-1.5 leading-relaxed">
          Xin chào <span id="fp_user_name" class="text-orange-400 font-bold"></span>!<br />
          Vì đây là lần đăng nhập đầu tiên, vui lòng đặt mật khẩu mới để bảo mật tài khoản.
        </p>
      </div>

      <form id="force_pwd_form" class="space-y-4">
        <!-- Mật khẩu mới -->
        <div>
          <label for="fp_new_pin" class="block text-[11px] font-bold uppercase tracking-widest text-orange-400 mb-2">
            Mật khẩu / Mã PIN mới
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-orange-400/70">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z" />
              </svg>
            </span>
            <input type="password" id="fp_new_pin" required minlength="4" placeholder="Nhập mật khẩu mới (tối thiểu 4 ký tự)" class="brand-input" />
          </div>
        </div>

        <!-- Xác nhận mật khẩu mới -->
        <div>
          <label for="fp_confirm_pin" class="block text-[11px] font-bold uppercase tracking-widest text-orange-400 mb-2">
            Xác nhận mật khẩu mới
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-orange-400/70">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" />
              </svg>
            </span>
            <input type="password" id="fp_confirm_pin" required minlength="4" placeholder="Nhập lại mật khẩu mới" class="brand-input" />
          </div>
        </div>

        <!-- Hiện mật khẩu -->
        <label class="inline-flex items-center gap-2 text-xs text-white/60 cursor-pointer select-none">
          <input type="checkbox" id="fp_show_pwd" class="w-3.5 h-3.5 rounded accent-[#E07242] cursor-pointer" />
          <span>Hiện mật khẩu</span>
        </label>

        <!-- Error Alert -->
        <div id="fp_error_alert"
          class="hidden p-3 bg-rose-500/10 border border-rose-500/20 text-rose-300 rounded-xl text-xs font-semibold leading-relaxed">
        </div>

        <!-- Submit -->
        <button type="submit" id="btn_fp_submit" class="btn-login mt-2">
          <span>LƯU MẬT KHẨU & TIẾP TỤC</span>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
          </svg>
        </button>

        <button type="button" id="btn_fp_cancel"
          class="w-full py-2 text-xs font-bold text-white/50 hover:text-white/80 transition cursor-pointer">
          ← Quay lại đăng nhập tài khoản khác
        </button>
      </form>
    </div>
  </main>

  <footer class="text-center py-4 text-[#877A6E] text-xs border-t border-[#E9C691]/20">
    Truy cập tối ưu hóa cho màn hình Smartphone
  </footer>

  <script>
    // Removed fillCreds function
  </script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script type="module" src="/auth.js"></script>
</body>

</html>
