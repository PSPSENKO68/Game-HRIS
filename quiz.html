<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trận Đấu — Đấu Trường Kiến Thức</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" />
    <style>
      body { background: #F9F5F0; }
      
      .quiz-header {
        background: linear-gradient(145deg, #2C2C2C 0%, #1a1a1a 100%);
        border-bottom: 1px solid rgba(224, 114, 66, 0.2);
      }
      
      .brand-card-light {
        background: #ffffff;
        border: 1px solid rgba(224, 114, 66, 0.2);
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      }

      .progress-bg { background: rgba(255,255,255,0.1); }
      .progress-fill { background: linear-gradient(90deg, #E07242, #E5853F, #677B40); }

      /* Modals */
      .modal-overlay { background: rgba(44,44,44,0.7); backdrop-filter: blur(4px); }
      .brand-card-dark {
        background: linear-gradient(145deg, #2C2C2C 0%, #1a1a1a 100%);
        border: 1px solid rgba(224, 114, 66, 0.2);
      }

      @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(15px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-in { animation: fadeSlideUp 0.3s ease forwards; }

      @keyframes scorePop {
        0% { transform: scale(1); }
        50% { transform: scale(1.3); color: #fff; text-shadow: 0 0 15px #E07242; }
        100% { transform: scale(1); }
      }
      .score-animate { animation: scorePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
  </head>
  <body class="min-h-screen flex flex-col justify-between select-none">

    <!-- Top Header & Progress bar -->
    <header class="quiz-header shadow-lg py-3.5 px-4 sticky top-0 z-40">
      <div class="max-w-md mx-auto flex items-center justify-between">
        <!-- Back button -->
        <button id="btn_quit_quiz" class="text-white/60 hover:text-rose-400 font-extrabold text-xs flex items-center gap-1 cursor-pointer transition">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
          </svg>
          Thoát
        </button>

        <!-- Current play index indicator -->
        <span class="font-['Space_Grotesk'] font-black text-white text-sm uppercase tracking-wide" id="question_counter">Câu 0/10</span>

        <!-- Spacer for alignment -->
        <div class="w-16"></div>
      </div>

      <!-- Linear progress bar container -->
      <div class="w-full progress-bg h-1.5 mt-3 rounded-full overflow-hidden max-w-md mx-auto">
        <div id="progress_bar_fill" class="progress-fill h-full progress-bar-fill transition-all duration-300" style="width: 0%"></div>
      </div>
    </header>

    <!-- Quiz Board area -->
    <main class="w-full max-w-md mx-auto px-4 py-6 flex-1 flex flex-col justify-between animate-in">
      
      <!-- Question Section -->
      <div class="brand-card-light rounded-3xl p-5 flex-1 flex flex-col justify-center min-h-[110px] relative mb-5">
        <!-- Floating category/week badge -->
        <div class="absolute top-4 left-4 inline-flex px-2.5 py-0.5 bg-orange-50 border border-orange-100 rounded-full text-[9px] text-[#E07242] font-black uppercase tracking-wider" id="quiz_week_badge">
          Tuần Này
        </div>
        
        <!-- Countdown timer badge -->
        <div class="absolute top-4 right-4 inline-flex items-center justify-center w-9 h-9 bg-rose-50 border-2 border-rose-200 rounded-full text-rose-600 font-black text-xs shadow-sm" id="countdown_timer">
          15
        </div>

        <p class="font-extrabold text-center text-[#2C2C2C] leading-relaxed text-base md:text-lg block" id="question_text">
          Đang chuẩn bị câu hỏi...
        </p>
      </div>

      <!-- Current session score indicator (Centered Pill) -->
      <div class="flex justify-center mb-5">
        <div id="score_pill" class="flex items-center justify-center gap-2 bg-[#2C2C2C] border border-[#E07242]/30 px-6 py-2 rounded-full text-[#E9C691] font-extrabold shadow-xl min-w-[120px]">
          <span class="text-[10px] text-white/60 uppercase tracking-widest font-bold mt-0.5">Điểm:</span>
          <span id="score_display" class="text-2xl font-black font-['Space_Grotesk'] text-[#E9C691] tracking-tight transition-transform">0</span>
        </div>
      </div>

      <!-- Live Answer Choice Segment (Feedback alert overlay when chosen) -->
      <div id="feedback_banner" class="hidden mb-4 p-4 rounded-2xl flex items-center justify-between overflow-hidden shadow-lg border">
        <div class="flex items-center gap-3">
          <div id="feedback_icon" class="w-10 h-10 rounded-full bg-white flex items-center justify-center font-bold text-lg shadow-sm">
            ✓
          </div>
          <div>
            <p id="feedback_title" class="font-black text-sm uppercase tracking-wide text-white"></p>
            <p id="feedback_sub" class="text-xs text-white/90 font-medium"></p>
          </div>
        </div>
        <button id="btn_next_question" class="bg-white text-slate-900 font-extrabold px-6 py-2.5 rounded-xl shadow-md active:scale-95 transition cursor-pointer text-xs uppercase tracking-tight">
          Tiếp tục
        </button>
      </div>

      <!-- Grid of 4 colored Options cards (Kahoot shape pattern) -->
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2" id="answers_container">
        <!-- Answer 1 (Red / Triangle) -->
        <button id="opt_red" class="opt-btn w-full min-h-[72px] text-left p-4 rounded-2xl text-white bg-kahoot-red hover:bg-[#c9122f] shadow-md hover:shadow-lg transition transform active:scale-[0.98] outline-none cursor-pointer flex items-center space-x-3 group relative border border-transparent hover:border-white/20">
          <div class="flex-shrink-0 w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center">
            <div class="kahoot-triangle border-b-white"></div>
          </div>
          <span class="text-white font-bold leading-snug text-[13px] pr-4 select-none" id="text_red">...</span>
        </button>

        <!-- Answer 2 (Blue / Diamond) -->
        <button id="opt_blue" class="opt-btn w-full min-h-[72px] text-left p-4 rounded-2xl text-white bg-kahoot-blue hover:bg-[#0e54a8] shadow-md hover:shadow-lg transition transform active:scale-[0.98] outline-none cursor-pointer flex items-center space-x-3 group relative border border-transparent hover:border-white/20">
          <div class="flex-shrink-0 w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center">
            <div class="kahoot-diamond bg-white"></div>
          </div>
          <span class="text-white font-bold leading-snug text-[13px] pr-4 select-none" id="text_blue">...</span>
        </button>

        <!-- Answer 3 (Yellow / Circle) -->
        <button id="opt_yellow" class="opt-btn w-full min-h-[72px] text-left p-4 rounded-2xl text-white bg-kahoot-yellow hover:bg-[#bc8900] shadow-md hover:shadow-lg transition transform active:scale-[0.98] outline-none cursor-pointer flex items-center space-x-3 group relative border border-transparent hover:border-white/20">
          <div class="flex-shrink-0 w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center">
            <div class="kahoot-circle bg-white"></div>
          </div>
          <span class="text-white font-bold leading-snug text-[13px] pr-4 select-none" id="text_yellow">...</span>
        </button>

        <!-- Answer 4 (Green / Square) -->
        <button id="opt_green" class="opt-btn w-full min-h-[72px] text-left p-4 rounded-2xl text-white bg-kahoot-green hover:bg-[#1f7009] shadow-md hover:shadow-lg transition transform active:scale-[0.98] outline-none cursor-pointer flex items-center space-x-3 group relative border border-transparent hover:border-white/20">
          <div class="flex-shrink-0 w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center">
            <div class="kahoot-square bg-white"></div>
          </div>
          <span class="text-white font-bold leading-snug text-[13px] pr-4 select-none" id="text_green">...</span>
        </button>
      </div>
    </main>

    <div class="h-4"></div>

    <!-- Confirm quit dialog overlay -->
    <div id="quit_confirm_modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
      <div class="brand-card-dark rounded-3xl p-6 max-w-sm w-full shadow-2xl text-white">
        <h3 class="text-lg font-black text-white mb-2 font-['Space_Grotesk'] uppercase tracking-wider text-center">Thoát trận đấu?</h3>
        <p class="text-white/70 text-xs mb-6 leading-relaxed text-center">
          Nếu bạn thoát bây giờ kết quả thi đấu của bạn hôm nay sẽ không được ghi nhận. Bạn có chắc không?
        </p>
        <div class="grid grid-cols-2 gap-3">
          <button id="btn_cancel_quit" class="bg-white/10 text-white font-bold py-3 px-4 rounded-xl hover:bg-white/20 transition cursor-pointer text-xs border border-white/10 uppercase">
            Tiếp tục chơi
          </button>
          <button id="btn_confirm_quit" class="bg-rose-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-rose-700 transition cursor-pointer text-xs uppercase">
            Chắc chắn thoát
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/quiz.js"></script>
  </body>
</html>
